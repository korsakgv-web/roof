    :root {
      --bg-dark: #18181b;
      --panel-bg: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #eab308;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .topbar {
      background: var(--panel-bg);
      padding: 8px 10px;
      display: flex; flex-wrap: wrap; gap: 6px;
      align-items: center; justify-content: space-between;
      border-bottom: 1px solid #3f3f46;
      z-index: 1000;
    }
    .topbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    select, button {
      background: #3f3f46; color: #fff; border: 1px solid #52525b;
      padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); border-color: #2563eb; }
    .btn-success { background: #16a34a; border-color: #15803d; }
    .btn-warn { background: #d97706; border-color: #b45309; }

    .status-bar {
      background: #1f1f23; padding: 6px 12px; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #3f3f46; color: var(--text-muted);
      z-index: 999;
    }
    .status-bar b { color: #fff; }

    #map { flex: 1; width: 100%; background: #e5e5e5; }

    /* Центральное ядро точки, вокруг которого наращиваются концентрические кольца */
    .pt-core {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #ffffff;
      color: #111111;
      font-weight: 800;
      font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
      user-select: none;
      border: 1.2px solid #27272a;
      transition: transform 0.1s;
    }
    .pt-core-active {
      background: #fef08a; /* Мягкая подсветка центра для точек текущей станции */
      border-color: #000;
    }

    /* Модальное окно ввода закреплено ВВЕРХУ экрана */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: flex-start; justify-content: center;
      padding-top: 8px;
      z-index: 2000;
    }
    .modal-backdrop.active { display: flex; }
    .modal-sheet {
      background: var(--panel-bg); width: 100%; max-width: 480px;
      border-radius: 14px; padding: 12px 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.65);
      margin: 0 8px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .modal-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .close-btn {
      background: transparent; border: none; color: var(--text-muted);
      font-size: 20px; padding: 0 6px;
    }
    .info-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      margin-bottom: 8px; background: #18181b; padding: 7px; border-radius: 8px;
    }
    .info-cell { text-align: center; }
    .info-label { font-size: 10px; color: var(--text-muted); display: block; }
    .info-val { font-size: 14px; font-weight: 700; margin-top: 2px; display: block; }

    .history-chips {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; font-size: 11px; max-height: 48px; overflow-y: auto;
    }
    .chip { padding: 3px 6px; border-radius: 4px; color: #000; font-weight: 600; border: 1px solid #000; }

    .field-lbl { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .input-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .input-row input {
      flex: 1; background: #18181b; border: 2px solid #52525b;
      color: #fff; font-size: 20px; font-weight: 700; padding: 7px 8px;
      border-radius: 8px; text-align: center; outline: none; width: 100%;

    .input-row input:focus { border-color: var(--accent); }
    .sign-btn {

      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;

    .table-modal {

    .table-container { flex: 1; overflow: auto; padding: 10px; }

    td.pt-col { text-align: center; font-weight: bold; background: #27272a; position: sticky; left: 0; }

  <script>
    // Автогенерация PNG-иконки 180x180 для iOS (Золотой купол с геодезическим перекрестием)
    (function() {
      const c = document.createElement('canvas');
      c.width = 180; c.height = 180;
      const ctx = c.getContext('2d');

      // 1. Темно-графитовый фон с легким градиентом
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 180);
      bgGrad.addColorStop(0, '#18181b');
      bgGrad.addColorStop(1, '#27272a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 180, 180);

      // 2. Золотистый градиент для купола
      const goldGrad = ctx.createLinearGradient(40, 35, 140, 145);
      goldGrad.addColorStop(0, '#fef08a');
      goldGrad.addColorStop(0.5, '#eab308');
      goldGrad.addColorStop(1, '#a16207');

      // Шпиль и фонарик купола
      ctx.fillStyle = goldGrad;
      ctx.fillRect(88, 16, 4, 18);
      ctx.beginPath();
      ctx.arc(90, 38, 7, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(81, 38, 18, 12);

      // Главный свод купола Исаакия
      ctx.beginPath();
      ctx.arc(90, 108, 56, Math.PI, 0, false);
      ctx.closePath();
      ctx.fillStyle = goldGrad;
      ctx.fill();

      // Барабан (колоннада) под куполом
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(30, 110, 120, 18);
      ctx.fillStyle = '#18181b';
      for (let x = 38; x <= 138; x += 12) {
        ctx.fillRect(x, 113, 5, 12);
      }
      // Основание
      ctx.fillStyle = goldGrad;
      ctx.fillRect(22, 130, 136, 8);

      // 3. Геодезическое перекрестие (сетка нитей тахеометра) поверх купола
      ctx.strokeStyle = '#38bdf8'; // Ярко-голубой контрастный прицел
      ctx.lineWidth = 2.5;

      // Внешнее кольцо прицела
      ctx.beginPath();
      ctx.arc(90, 88, 32, 0, Math.PI * 2);
      ctx.stroke();

      // Перекрестие нитей
      ctx.beginPath();
      ctx.moveTo(42, 88); ctx.lineTo(138, 88);
      ctx.moveTo(90, 40); ctx.lineTo(90, 136);
      ctx.stroke();

      // Красная лазерная точка в центре наведения
      ctx.beginPath();
      ctx.arc(90, 88, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 4. Подпись внизу иконки
      ctx.fillStyle = '#f4f4f5';
      ctx.font = 'bold 17px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u0418\u0421\u0410\u0410\u041A\u0418\u0419', 90, 162);

      // Подключаем сгенерированную PNG-иконку для iPhone
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    })();
  </script>

async function handlePlanUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (file.type === 'application/pdf') {
    const arrayBuffer = await file.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
    state.bgDataUrl = dataUrl;
    saveState();
    setMapBackground(dataUrl);
  } else {
    const reader = new FileReader();
    reader.onload = (ev) => {
      state.bgDataUrl = ev.target.result;
      saveState();
      setMapBackground(ev.target.result);
    };
    reader.readAsDataURL(file);
  }
}

function getEffectiveZ(measObj) {
  if (!measObj) return null;
  if (typeof measObj === 'number') return measObj;
  return Number(measObj.z || 0) + Number(measObj.tape || 0);
}

function getStationAvgDiff(stId, excludePtId = null) {
  const stMeas = state.measurements[stId] || {};
  const diffs = [];
  for (const [ptIdStr, mObj] of Object.entries(stMeas)) {
    const ptId = Number(ptIdStr);
    if (ptId === excludePtId) continue;
    const effZ = getEffectiveZ(mObj);
    if (effZ !== null && BASE_MAY_2026[ptId] !== undefined) {
      diffs.push(effZ - BASE_MAY_2026[ptId]);
    }
  }
  if (!diffs.length) return null;
  diffs.sort((a,b) => a - b);
  const mid = Math.floor(diffs.length / 2);
  return diffs.length % 2 !== 0 ? diffs[mid] : (diffs[mid - 1] + diffs[mid]) / 2;
}

// Генерация концентрических колец с черными разделительными полосами через многослойный box-shadow
function buildConcentricRingsShadow(stationIds, hasError) {
  if (stationIds.length === 0) {
    return '0 1px 3px rgba(0,0,0,0.4)';
  }
  const shadows = [];
  let radius = 0;
  const ringWidth = 3.5; // Толщина каждого цветного кольца станции (px)
  const sepWidth = 1.0;  // Толщина черной разделительной линии между кольцами (px)

  stationIds.forEach((stId) => {
    const st = STATIONS.find(s => s.id == stId);
    const col = st ? st.color : '#ccc';
    
    // Цветное кольцо станции
    radius += ringWidth;
    shadows.push(`0 0 0 ${radius}px ${col}`);
    
    // Черное разделительное кольцо снаружи
    radius += sepWidth;
    shadows.push(`0 0 0 ${radius}px #111111`);
  });

  if (hasError) {
    radius += 2.5;
    shadows.push(`0 0 0 ${radius}px #ef4444`);
    shadows.push(`0 0 ${radius + 6}px #ef4444`);
  } else {
    shadows.push(`0 2px ${radius + 4}px rgba(0,0,0,0.55)`);
  }

  return shadows.join(', ');
}

function renderMarkers() {
  Object.values(markersMap).forEach(m => map.removeLayer(m));
  markersMap = {};

  const curSt = state.activeStation;
  const stMedianDiff = getStationAvgDiff(curSt);

  ALL_POINT_IDS.forEach(ptId => {
    const c = state.coords[ptId] || { x: 500, y: 350 };
    const measuredStations = [];
    for (const st of STATIONS) {
      if (state.measurements[st.id] && state.measurements[st.id][ptId] !== undefined) {
        measuredStations.push(st.id);
      }
    }

    const isMeasuredOnCur = measuredStations.includes(Number(curSt));
    let hasError = false;

    if (isMeasuredOnCur && stMedianDiff !== null) {
      const effZ = getEffectiveZ(state.measurements[curSt][ptId]);
      const diff = effZ - BASE_MAY_2026[ptId];
      if (Math.abs(diff - stMedianDiff) > 4) {
        hasError = true;
      }
    }

    const boxShadow = buildConcentricRingsShadow(measuredStations, hasError);
    const activeClass = isMeasuredOnCur ? 'pt-core-active' : '';

    const icon = L.divIcon({
      className: '',
      html: `<div class="pt-core ${activeClass}" style="box-shadow: ${boxShadow};">${ptId}</div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const marker = L.marker([c.y, c.x], {
      icon,
      draggable: state.editMode,
      zIndexOffset: isMeasuredOnCur ? 500 : (measuredStations.length * 100)
    }).addTo(map);

    marker.on('click', () => {
      if (!state.editMode) openInputModal(ptId);
    });

    marker.on('dragend', (ev) => {
      const pos = ev.target.getLatLng();
      state.coords[ptId] = { x: Math.round(pos.lng * 10) / 10, y: Math.round(pos.lat * 10) / 10 };
      saveState();
    });

    markersMap[ptId] = marker;
  });
}

function onLiveInput() {
  const ptId = state.selectedPt;
  const stId = state.activeStation;
  const rawZ = document.getElementById('zInput').value;
  const rawTape = document.getElementById('tapeInput').value;
  const diffEl = document.getElementById('infoDiffBase');
  const devEl = document.getElementById('infoStDev');

  if (rawZ === '' || isNaN(Number(rawZ))) {
    diffEl.textContent = '\u2014';
    devEl.textContent = '\u2014';
    devEl.style.color = '#fff';
    return;
  }

  const z = Number(rawZ);
  const tape = rawTape === '' || isNaN(Number(rawTape)) ? 0 : Number(rawTape);
  const effZ = z + tape;

  const baseH = BASE_MAY_2026[ptId];
  const diff = effZ - baseH;
  diffEl.textContent = (diff > 0 ? '+' : '') + diff;

  const otherAvg = getStationAvgDiff(stId, ptId);
  if (otherAvg === null) {
    devEl.textContent = T.firstPt;
    devEl.style.color = '#a1a1aa';
  } else {
    const dev = Math.round((diff - otherAvg) * 10) / 10;
    devEl.textContent = (dev > 0 ? '+' : '') + dev + ' ' + T.mm;
    if (Math.abs(dev) <= 2) devEl.style.color = '#22c55e';
    else if (Math.abs(dev) <= 4) devEl.style.color = '#eab308';
    else devEl.style.color = '#ef4444';
  }
}

function computeAdjustedNetwork() {
  const activeStations = STATIONS.map(s => s.id).filter(
    stId => state.measurements[stId] && Object.keys(state.measurements[stId]).length > 0
  );

  const shifts = {};
  activeStations.forEach(stId => {
    const stMeas = state.measurements[stId];
    let sum = 0, cnt = 0;
    for (const [ptId, mObj] of Object.entries(stMeas)) {
      const effZ = getEffectiveZ(mObj);
      sum += (BASE_MAY_2026[ptId] - effZ);
      cnt++;
    }
    shifts[stId] = cnt > 0 ? sum / cnt : 0;
  });

  const avgPoints = {};
  for (let iter = 0; iter < 80; iter++) {
    ALL_POINT_IDS.forEach(ptId => {
      let sum = 0, cnt = 0;
      activeStations.forEach(stId => {
        const mObj = state.measurements[stId]?.[ptId];
        const effZ = getEffectiveZ(mObj);
        if (effZ !== null) {
          sum += (effZ + shifts[stId]);
          cnt++;
        }
      });
      if (cnt > 0) avgPoints[ptId] = sum / cnt;
    });

    activeStations.forEach(stId => {
      const stMeas = state.measurements[stId];
      let sum = 0, cnt = 0;
      for (const [ptId, mObj] of Object.entries(stMeas)) {
        const effZ = getEffectiveZ(mObj);
        sum += (avgPoints[ptId] - effZ);
        cnt++;
      }
      if (cnt > 0) shifts[stId] = sum / cnt;
    });

    let totalDiff = 0, totalPts = 0;
    for (const [ptId, hVal] of Object.entries(avgPoints)) {
      totalDiff += (hVal - BASE_MAY_2026[ptId]);
      totalPts++;
    }
    if (totalPts > 0) {
      const globalOffset = totalDiff / totalPts;
      activeStations.forEach(stId => { shifts[stId] -= globalOffset; });
      for (const ptId of Object.keys(avgPoints)) { avgPoints[ptId] -= globalOffset; }
    }
  }

  const roundedShifts = {};
  activeStations.forEach(stId => {
    roundedShifts[stId] = Math.round(shifts[stId] * 10) / 10;
  });

  const pointResults = {};
  ALL_POINT_IDS.forEach(ptId => {
    const vals = [];
    activeStations.forEach(stId => {
      const mObj = state.measurements[stId]?.[ptId];
      const effZ = getEffectiveZ(mObj);
      if (effZ !== null) {
        vals.push(effZ + roundedShifts[stId]);
      }
    });
    const count = vals.length;
    const avgH = count > 0 ? Math.round(vals.reduce((a,b) => a + b, 0) / count) : null;
    const baseH = BASE_MAY_2026[ptId];
    const delta = avgH !== null ? (avgH - baseH) : null;
    pointResults[ptId] = { count, avgH, baseH, delta };
  });

  return { shifts: roundedShifts, pointResults };
}

function openTableModal() {
  const { shifts, pointResults } = computeAdjustedNetwork();
  const wrap = document.getElementById('summaryTableWrap');

  let html = `<table><thead><tr>
    <th>${T.colPt}</th>
    <th>${T.colCnt}</th>
    <th>${T.colAvg}</th>
    <th>${T.colBase}</th>
    <th>${T.colDelta}</th>`;

  STATIONS.forEach(st => {
    const sh = shifts[st.id] !== undefined ? (shifts[st.id] > 0 ? '+' : '') + shifts[st.id] : '\u2014';
    html += `<th style="background:${st.color};color:#000;">${st.name}<br><small>${T.shiftWord}: ${sh}</small></th>`;
  });
  html += `</tr></thead><tbody>`;

  ALL_POINT_IDS.forEach(ptId => {
    const r = pointResults[ptId];
    const deltaColor = r.delta === null ? '' : (Math.abs(r.delta) > 5 ? 'color:#ef4444;font-weight:bold;' : 'color:#22c55e;');
    html += `<tr>
      <td class="pt-col">${ptId}</td>
      <td style="text-align:center;">${r.count || '-'}</td>
      <td style="font-weight:bold;">${r.avgH !== null ? r.avgH : '-'}</td>
      <td>${r.baseH}</td>
      <td style="${deltaColor}">${r.delta !== null ? (r.delta > 0 ? '+' : '') + r.delta : '-'}</td>`;

    STATIONS.forEach(st => {
      const mObj = state.measurements[st.id]?.[ptId];
      const effZ = getEffectiveZ(mObj);
      if (effZ !== null) {
        const adj = Math.round(effZ + (shifts[st.id] || 0));
        const tapeInfo = (mObj.tape && mObj.tape !== 0) ? ` <span style="color:#eab308;font-size:10px;">[${T.tapeShort}+${mObj.tape}]</span>` : '';
        html += `<td>${adj}${tapeInfo} <span style="color:#a1a1aa;font-size:10px;">(${effZ})</span></td>`;
      } else {
        html += `<td style="text-align:center;color:#52525b;">-</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  wrap.innerHTML = html;
  document.getElementById('tableModal').classList.add('active');
}

function closeTableModal() {
  document.getElementById('tableModal').classList.remove('active');
}

function exportToExcel() {
  const { shifts, pointResults } = computeAdjustedNetwork();
  const rows = [];

  const header1 = [];
  STATIONS.forEach(st => {
    header1.push(`${st.name} (${T.readingWord})`, `${T.diffShort} ${st.id}`);
  });
  header1.push(T.colPt, T.colAvg, T.colCnt, T.colBase, T.colDelta);
  STATIONS.forEach(st => {
    const sh = shifts[st.id] !== undefined ? shifts[st.id] : 0;
    header1.push(`${st.name} (${T.shiftWord}: ${sh})`);
  });
  rows.push(header1);

  ALL_POINT_IDS.forEach(ptId => {
    const row = [];
    const baseH = BASE_MAY_2026[ptId];
    const res = pointResults[ptId];

    STATIONS.forEach(st => {
      const mObj = state.measurements[st.id]?.[ptId];
      const effZ = getEffectiveZ(mObj);
      if (effZ !== null) {
        const tapeNote = (mObj.tape && mObj.tape !== 0) ? ` (${T.tapeShort}+${mObj.tape})` : '';
        row.push(tapeNote ? `${effZ}${tapeNote}` : effZ, effZ - baseH);
      } else {
        row.push('-', '-');
      }
    });

    row.push(
      ptId,
      res.avgH !== null ? res.avgH : '-',
      res.count,
      baseH,
      res.delta !== null ? res.delta : '-'
    );

    STATIONS.forEach(st => {
      const mObj = state.measurements[st.id]?.[ptId];
      const effZ = getEffectiveZ(mObj);
      if (effZ !== null && shifts[st.id] !== undefined) {
        row.push(Math.round(effZ + shifts[st.id]));
      } else {
        row.push('-');
      }
    });

    rows.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Monitoring');

  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `Isaakiy_Krovlya_${dateStr}.xlsx`);
}

function exportProjectBackup() {
  const backup = {
    coords: state.coords,
    measurements: state.measurements,
    bgDataUrl: state.bgDataUrl
  };
  const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'isaakiy_project_base.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importProjectBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.coords) state.coords = data.coords;
      if (data.measurements) {
        state.measurements = data.measurements;
        migrateMeasurements();
      }
      if (data.bgDataUrl) {
        state.bgDataUrl = data.bgDataUrl;
        setMapBackground(state.bgDataUrl);
      }
      saveState();
      renderMarkers();
      updateStatusBar();
      alert(T.loadedOk);
    } catch (err) {
      alert('Error JSON');
    }
  };
  reader.readAsText(file);
}

function clearCurrentCycle() {
  if (confirm(T.confirmClear)) {
    state.measurements = {};
    saveState();
    renderMarkers();
    updateStatusBar();
  }
}
</script>
